description: 'Requires the client session of the subscription creator. Set SUBSCRIPTION_ID in your private Yaak environment. device is pei or per. ruleTypes can combine uniform and seniority; per also allows unilateral. A payment type belongs to only one rule. Incomplete values can be saved as a draft; step 3 validation requires every active rule to be complete. Limits are entered manually, including legal limits. Replacing a device removes deselected rules. Returns the saved device matching in 200; authentication, access, missing subscription and validation errors return 401, 403, 404 and 422. Changes invalidate step 3.'
