description: 'KYC documents are required per owner (10 identity, 11 RNE/Kbis); type 9 BIC is never requested or returned, even when bicId is true. Requires a client session with access to this subscription (see folder access rules). Set SUBSCRIPTION_ID in your private Yaak environment. Returns editRevision and x-subscription-revision for concurrency control, and contractFees (pricingOffer, annualAccountFee and annualAccountFeePerEmployee in euros, entryFeePayer and entryFeeRate in percent), plus contractCharacteristics including numeric existingAgreements, matchingCalculationMethod and matchingDistributionPeriod codes, otherAgreementDetails, minimumSeniorityMonths, matchingRules with numeric rule and payment codes, and voluntary payment period fields, plus contractDocuments for selected agreements (pending or attached). Also returns formalism.groups (group 1 PEI/PER and group 2 participation, nullable method, meeting, president, mandatedMemberId, members and methodInvalidated flag) and formalism.employees shared by ratification groups; absent groups use empty defaults without database writes. Attached document URLs are time-limited and trigger a download. Each document includes rneUrl (nullable): the step 1 RNE existence proof links to the Annuaire des entreprises using the saved nine-digit company SIREN; other requirements and missing or malformed SIRENs return null. This link does not attach a document. Returns meta.canUpdate; creator.name is null if the creator was deleted.'
