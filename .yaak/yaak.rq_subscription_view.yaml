description: 'KYC documents are required per owner (10 identity, 11 RNE/Kbis); type 9 BIC is never requested or returned, even when bicId is true. Requires the client session of the subscription creator. Set SUBSCRIPTION_ID in your private Yaak environment. Returns contractFees (pricingOffer, annualAccountFee and annualAccountFeePerEmployee in euros, entryFeePayer and entryFeeRate in percent), plus contractCharacteristics including numeric existingAgreements, matchingCalculationMethod and matchingDistributionPeriod codes, otherAgreementDetails, minimumSeniorityMonths, matchingRules with numeric rule and payment codes, and voluntary payment period fields, plus contractDocuments for selected agreements (pending or attached). Also returns formalism.groups (group 1 PEI/PER and group 2 participation, nullable method, meeting, president, mandatedMemberId, members and methodInvalidated flag) and formalism.employees shared by ratification groups; absent groups use empty defaults without database writes. Attached document URLs are time-limited and trigger a download.'
