description: 'Requires a client session with access to this subscription (see folder access rules). Set SUBSCRIPTION_ID and resource IDs in your private Yaak environment. Successful changes invalidate step 5. Returns 200 (204 for deletion), 401 if unauthenticated, 403 outside the authorized scope, 404 for a missing or unrelated resource, and 422 for invalid values or an unavailable method. Group: 1 (PEI/PER), 2 (participation). The group must match selected devices. method: 1 (CSE), 2 (ratification), 3 (unilateral decision). A positive headcount is required; method 3 is restricted to group 1 below 50 employees. Send changed fields only; omitted fields are retained and null clears draft values. CSE fields require method 1. Dates use YYYY-MM-DD, time HH:mm, votes non-negative integers. mandatedMemberId accepts a member ID from this group or null. Selecting CSE creates one blank member. Leaving CSE removes its meeting and people. Leaving the last ratification removes the shared employees. An optional members array replaces the CSE members atomically, with new IDs. Each entry accepts firstName, lastName, email, function, attending and a required mandated boolean (at most one true). Omit members to preserve the list. Do not combine members with mandatedMemberId. To reuse PEI/PER people in participation, PUT /formalism/2 with the source president fields and members, without their IDs; omit meeting and votes to preserve them. Returns the saved group.'
