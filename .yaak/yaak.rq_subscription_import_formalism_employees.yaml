description: 'Requires the client session of the subscription creator. Set SUBSCRIPTION_ID and resource IDs in your private Yaak environment. Successful changes invalidate step 5. Returns 200 (204 for deletion), 401 if unauthenticated, 403 for another creator, 404 for a missing or unrelated resource, and 422 for invalid values or an unavailable method. Requires active ratification. Select a local test CSV, up to 10 MiB, with nom, prénom, email headers and comma or semicolon separators; UTF-8 BOM is supported. Appends all valid rows atomically. Exact duplicates after trimming and email normalization are skipped; a reused email with different names or any invalid line rejects the entire import. Returns added, skipped and the complete employees list. Validation errors identify CSV line numbers.'
