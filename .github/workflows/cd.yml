name: "[CD]"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: 📝 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Publish GitHub release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
